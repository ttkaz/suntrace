<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102e35">
  <title>ひだまり | SunTrace v0.1</title>
  <link rel="stylesheet" href="./css/style.css">
  <script defer src="./js/app.js"></script>
</head>
<body>
  <main class="app">
    <video id="camera" autoplay muted playsinline aria-label="背面カメラ映像"></video>
    <div class="shade"></div>
    <header><div class="brand">☀ ひだまり <small>SunTrace v0.1</small></div><div id="status" role="status">開始待ち</div></header>
    <div class="crosshair" aria-hidden="true"><span>＋</span></div>
    <section class="panel" aria-label="センサーデータ">
      <div class="grid">
        <div><label>コンパス方位（北=0°）</label><strong id="heading">—</strong><small id="accuracy">精度: —</small></div>
        <div><label>alpha（Z軸回転）</label><strong id="alpha">—</strong></div>
        <div><label>beta（前後傾き）</label><strong id="beta">—</strong></div>
        <div><label>gamma（左右傾き）</label><strong id="gamma">—</strong></div>
      </div>
      <p id="screen">画面回転: —</p>
      <p class="note">※ ここに表示するのはセンサーの生データです。コンパス方位はカメラの光軸方向と必ずしも一致しません。AR用の姿勢変換・補正は次の段階で実装します。</p>
      <div class="actions"><button id="start">カメラ・センサーを開始</button><button id="stop" disabled>停止</button></div>
      <p class="message" id="message">iPhoneのSafariで「開始」を押し、必要な権限を許可してください。</p>
    </section>
  </main>
</body>
</html>
