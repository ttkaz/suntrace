<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102e35">
<title>ひだまり | SunTrace v0.4</title><link rel="stylesheet" href="./css/style.css?v=0.4.0">
<script defer src="./js/solar.js?v=0.4.0"></script><script defer src="./js/app.js?v=0.4.0"></script></head>
<body><main class="app">
<div class="camera-stage"><video id="camera" autoplay muted playsinline></video><div class="crosshair">＋</div><div id="sunMarker" class="sunMarker" hidden>☀</div><p class="stage-caption" id="viewHint">映像は全体表示（切り抜きなし）</p></div>
<header><div><strong>☀ ひだまり</strong><small>SunTrace v0.4 / カメラ画角比較</small></div><span id="status">開始待ち</span></header>
<section class="panel">
<div class="actions"><button id="start">開始</button><button id="stop" disabled>停止</button><button id="locate">GPS取得</button></div>
<label for="cameraSelect">利用可能なカメラ</label><div class="selectRow"><select id="cameraSelect" disabled><option>開始後に一覧取得</option></select><button id="refreshCameras" disabled>再取得</button></div>
<p id="cameraInfo" class="minor">起動後に選択カメラの実際の映像情報を表示します。</p>
<div class="diagnostic"><span>機器のカメラ名</span><strong id="trackLabel">—</strong><span>要求したdeviceId</span><code id="requestedId">—</code><span>実際のdeviceId</span><code id="actualId">—</code><span>映像解像度</span><strong id="resolution">—</strong><span>zoom（設定 / 対応）</span><strong id="zoomInfo">—</strong><span>videoサイズ / 表示領域</span><strong id="videoInfo">—</strong></div>
<div class="dateRow"><label for="dateTime">予測日時</label><input type="datetime-local" id="dateTime"><button id="now">現在</button></div>
<div class="metrics"><span>太陽方位<b id="sunAz">—</b></span><span>太陽高度<b id="sunAlt">—</b></span><span>端末方位<b id="heading">—</b></span></div>
<details><summary>GPS・姿勢情報・仮AR補正</summary><div class="grid"><div><label>緯度 / 経度</label><strong id="coords">未取得</strong><small id="gpsAccuracy">精度: —</small></div><div><label>コンパス精度</label><strong id="accuracy">—</strong></div><div><label>beta（前後）</label><strong id="beta">—</strong></div><div><label>alpha / gamma</label><strong id="other">—</strong></div><div><label>画面回転</label><strong id="screen">—</strong></div></div>
<label for="azOffset">水平補正 <span id="azOffsetValue">0°</span></label><input id="azOffset" type="range" min="-90" max="90" value="0"><label for="altOffset">垂直補正 <span id="altOffsetValue">0°</span></label><input id="altOffset" type="range" min="-90" max="90" value="0"><button id="resetOffset">補正リセット</button><p class="minor">仮ARマーカーは未校正です。測定には利用しないでください。</p></details>
<p id="message" class="message" role="status">開始後、背面広角・超広角を切り替えて同じ被写体の映る範囲を比較してください。</p>
</section></main></body></html>
